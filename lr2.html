<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивна навігація</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #333; color: white; }
        .nav-logo { color: white; text-decoration: none; }
        .nav-menu { display: flex; list-style: none; }
        .nav-link { display: block; color: white; text-decoration: none; padding: 10px; }
        
        /* Випадаюче меню для десктопа */
        .dropdown { position: relative; }
        .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: #444; list-style: none; }
        @media (min-width: 769px) {
            .dropdown:hover .dropdown-menu { display: block; }
        }
        
        .search-form { display: flex; }

        .burger-toggle { display: none; flex-direction: column; justify-content: space-between; width: 20px; height: 15px; background: transparent; border: none; cursor: pointer; }
        .burger-toggle span { width: 100%; height: 2px; background: white; }

        @media (max-width: 768px) {
            .burger-toggle { display: flex; }
            .nav-menu { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: #333; }
            .nav-menu.show { display: flex; }
            .dropdown-menu { position: relative; background: #222; }
            .dropdown-menu.open { display: block; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="nav-logo">Лабораторна робота №2</a>

        <button class="burger-toggle" id="burgerBtn">
            <span></span><span></span><span></span>
        </button>

        <ul class="nav-menu" id="navMenu">
            <li><a href="#" class="nav-link">Головна</a></li>
            <li><a href="#" class="nav-link">Про нас</a></li>
            <li class="dropdown">
                <a href="#" class="nav-link" id="dropdownLink">Послуги ▼</a>
                <ul class="dropdown-menu" id="dropdownMenu">
                    <li><a href="#" class="nav-link">Веб-розробка</a></li>
                    <li><a href="#" class="nav-link">Веб-дизайн</a></li>
                </ul>
            </li>
            <li><a href="#" class="nav-link">Контакти</a></li>
            <li>
                <form class="search-form">
                    <input type="search" placeholder="Пошук...">
                    <button type="submit">Знайти</button>
                </form>
            </li>
        </ul>
    </nav>

    <script>
        const burgerBtn = document.getElementById('burgerBtn');
        const navMenu = document.getElementById('navMenu');
        const dropdownLink = document.getElementById('dropdownLink');
        const dropdownMenu = document.getElementById('dropdownMenu');

        burgerBtn.addEventListener('click', () => {
            navMenu.classList.toggle('show');
        });

        dropdownLink.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                e.preventDefault();
                dropdownMenu.classList.toggle('open');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                navMenu.classList.remove('show');
            }
        });
    </script>
</body>
</html>
