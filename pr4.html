<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота №4</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: Arial, sans-serif; 
        }
        
        body { 
            padding: 20px; 
            height: 150vh; 
            background: #f4f4f4; 
        }

        .dropdown { 
            position: relative; 
            display: inline-block; 
            margin-bottom: 20px; 
        }
        
        .dropdown-menu { 
            display: none; 
            position: absolute; 
            background: white; 
            border: 1px solid #ccc; 
            list-style: none; 
            min-width: 120px; 
        }
        
        .dropdown-menu.show { 
            display: block; 
        }
        
        .dropdown-menu li a { 
            display: block; 
            padding: 8px; 
            text-decoration: none; 
            color: #333; 
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.5); 
            justify-content: center; 
            align-items: center; 
        }
        
        .modal.active { 
            display: flex; 
        }
        
        .modal-content { 
            background: white; 
            padding: 20px; 
            border-radius: 5px; 
            position: relative; 
        }

        .gallery { 
            margin: 20px 0; 
        }
        
        .main-img { 
            width: 300px; 
            height: 200px; 
            display: block; 
            object-fit: cover; 
            margin-bottom: 10px; 
        }
        
        .thumbs { 
            display: flex; 
            gap: 10px; 
        }
        
        .thumbs img { 
            width: 60px; 
            height: 40px; 
            cursor: pointer; 
            object-fit: cover; 
        }

        .feedback-form { 
            max-width: 300px; 
            background: white; 
            padding: 15px; 
            border: 1px solid #ccc; 
            margin-top: 20px; 
        }
        
        .feedback-form input { 
            width: 100%; 
            padding: 8px; 
            margin: 5px 0; 
        }
        
        .error { 
            color: red; 
            font-size: 12px; 
            display: none; 
        }
        
        .success { 
            color: green; 
            font-size: 14px; 
            display: none; 
        }

        .scroll-btn { 
            display: none; 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            padding: 10px; 
            background: #333; 
            color: white; 
            border: none; 
            cursor: pointer; 
        }
        
        .scroll-btn.show { 
            display: block; 
        }
    </style>
</head>
<body>

    <div class="dropdown">
        <button id="menuBtn">Меню ▼</button>
        <ul class="dropdown-menu" id="dropdownMenu">
            <li><a href="#">Посилання 1</a></li>
            <li><a href="#">Посилання 2</a></li>
        </ul>
    </div>

    <br>

    <button id="openModal">Відкрити модальне вікно</button>
    <div class="modal" id="myModal">
        <div class="modal-content">
            <p>Модальне вікно</p>
            <button id="closeModal">Закрити</button>
        </div>
    </div>

    <div class="gallery">
        <h3>Галерея</h3>
        <img src="https://picsum.photos/id/10/300/200" alt="Головне" class="main-img" id="mainImg">
        <div class="thumbs">
            <img src="https://picsum.photos/id/10/60/40" alt="img exp 1" onclick="changeImage('https://picsum.photos/id/10/300/200')">
            <img src="https://picsum.photos/id/15/60/40" alt="img exp 2" onclick="changeImage('https://picsum.photos/id/15/300/200')">
            <img src="https://picsum.photos/id/20/60/40" alt="img exp 3" onclick="changeImage('https://picsum.photos/id/20/300/200')">
        </div>
    </div>

    <form class="feedback-form" id="feedbackForm">
        <h3>Зворотній зв'язок</h3>
        <input type="email" id="emailInput" placeholder="Ваш Email">
        <div class="error" id="emailError">Некоректний email</div>
        <button type="submit">Надіслати</button>
        <div class="success" id="formSuccess">Форму успішно відправлено!</div>
    </form>

    <button class="scroll-btn" id="scrollTopBtn">Вгору ↑</button>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        menuBtn.addEventListener('click', () => dropdownMenu.classList.toggle('show'));

        const openModal = document.getElementById('openModal');
        const closeModal = document.getElementById('closeModal');
        const myModal = document.getElementById('myModal');
        
        openModal.addEventListener('click', () => myModal.classList.add('active'));
        closeModal.addEventListener('click', () => myModal.classList.remove('active'));

        function changeImage(src) {
            document.getElementById('mainImg').src = src;
        }

        const form = document.getElementById('feedbackForm');
        const emailInput = document.getElementById('emailInput');
        const emailError = document.getElementById('emailError');
        const formSuccess = document.getElementById('formSuccess');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value;
            
            if (!email.includes('@') || email.length < 5) {
                emailError.style.display = 'block';
                formSuccess.style.display = 'none';
            } else {
                emailError.style.display = 'none';
                formSuccess.style.display = 'block';
                form.reset();
            }
        });

        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 200) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
